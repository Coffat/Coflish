# E2E — chạy khi merge vào main hoặc PR gắn label `e2e`
# Cần MongoDB + Redis thật (dùng service containers).

name: e2e

on:
  push:
    branches: [main]
  pull_request:
    types: [labeled]

jobs:
  e2e:
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'e2e')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test:e2e
        env:
          MONGODB_URI: mongodb://localhost:27017/e2e
          REDIS_URL: redis://localhost:6379
          ADMIN_TOKEN: e2e-test-token
          # E2E không gọi AI thật — mock ở lib/ai/__mocks__

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
